<style>
:root{--bg:#fff8ec;--ink:#2b2b3a;--accent:#ff7a3d;--ok:#2fbf71;--line:#ffe2c4;--soft:#f6f1ea}
*{box-sizing:border-box}
html,body{margin:0;height:100%}
body{font-family:'Jua','Apple SD Gothic Neo','Malgun Gothic',sans-serif;background:var(--bg);color:var(--ink);-webkit-user-select:none;user-select:none;-webkit-tap-highlight-color:transparent;overflow:hidden}
button{font:inherit;color:inherit;cursor:pointer}
input,textarea{font:inherit;color:inherit}
#app{display:flex;flex-direction:column;height:100vh;height:100dvh}
header{display:flex;align-items:center;gap:8px;padding:8px 12px;background:#fff;border-bottom:3px solid var(--line);min-height:66px}
header h1{font-size:24px;margin:0 6px;font-weight:normal;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;flex:1}
.hb{border:none;border-radius:14px;padding:10px 14px;font-size:19px;background:var(--soft);white-space:nowrap}
.hb:disabled{opacity:.35;cursor:default}
.hb.go{background:var(--ok);color:#fff;box-shadow:0 3px 0 #20935a}
.hb.ic{width:48px;padding:10px 0;font-size:22px}
#view{flex:1;min-height:0;position:relative}
.scroll{position:absolute;inset:0;overflow-y:auto;padding:18px}
.ttl{font-size:28px;text-align:center;margin:4px 0 16px}
.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(190px,1fr));gap:16px;max-width:1200px;margin:0 auto}
.card{border:3px solid transparent;background:#fff;border-radius:22px;padding:12px;display:flex;flex-direction:column;align-items:center;gap:6px;box-shadow:0 4px 0 #0000001a;position:relative;text-align:center}
.card:hover{border-color:#ffd3bd}
.card .th{height:150px;width:100%;display:flex;align-items:center;justify-content:center}
.card .th svg{max-height:100%;max-width:100%}
.card b{font-weight:normal;font-size:21px}
.card small{color:#9a8f80;font-size:14px}
.card .badge{position:absolute;top:8px;left:8px;background:#fff1c2;border-radius:10px;padding:2px 8px;font-size:13px}
.card.new{border:3px dashed #ffb48f;background:#fff4ec;justify-content:center;font-size:24px;min-height:220px}
.card.new span{font-size:56px}
.empty{text-align:center;color:#9a8f80;font-size:20px;margin-top:20px}
/* 공방 */
.ed{position:absolute;inset:0;display:grid;grid-template-columns:96px 1fr 360px;grid-template-rows:1fr;min-height:0}
.faces{background:#fff;border-right:3px solid var(--line);overflow-y:auto;padding:8px 6px;display:flex;flex-direction:column;gap:6px}
.fb{border:3px solid transparent;background:var(--soft);border-radius:14px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;font-size:15px;position:relative}
.fb svg{width:64px;height:48px}
.fb.on{border-color:var(--accent);background:#fff1e8}
.fb i{position:absolute;top:2px;right:4px;font-style:normal;font-size:12px;background:#fff;border-radius:8px;padding:0 5px;color:#9a8f80}
.cvcol{display:flex;flex-direction:column;min-width:0;min-height:0}
.cvwrap{flex:1;position:relative;min-height:0;background:#ece6dc;-webkit-touch-callout:none;-webkit-user-select:none;user-select:none}
.cvwrap svg{position:absolute;inset:0;width:100%;height:100%;touch-action:none}
.cvbar{display:flex;gap:6px;align-items:center;padding:6px 8px;background:#fff;border-top:3px solid var(--line);flex-wrap:wrap}
.cvbar button{border:none;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:17px}
.cvbar button.on{background:#ffe1cf}
.cvbar .info{margin-left:auto;color:#9a8f80;font-size:15px}
.panel{background:#fff;border-left:3px solid var(--line);display:flex;flex-direction:column;min-height:0}
.tabs{display:flex;gap:4px;padding:8px 8px 0}
.tabs button{flex:1;border:none;border-radius:14px 14px 0 0;padding:10px 4px;font-size:18px;background:var(--soft)}
.tabs button.on{background:#ffe1cf}
.pbody{flex:1;overflow-y:auto;padding:10px 12px 24px;border-top:3px solid #ffe1cf}
.pbody h4{margin:14px 2px 6px;font-weight:normal;font-size:17px;color:#8a7f70}
.tray{display:grid;grid-template-columns:repeat(auto-fill,minmax(72px,1fr));gap:6px}
.ti{background:var(--soft);border:2px solid #efe8de;border-radius:14px;padding:4px 2px;display:flex;flex-direction:column;align-items:center;cursor:grab;touch-action:none;font-size:14px;text-align:center}
.ti:active{border-color:var(--accent)}
.ti svg{width:48px;height:48px;pointer-events:none}
.ghost{position:fixed;pointer-events:none;z-index:50;transform:translate(-50%,-50%);opacity:.85}
.ptitle{font-size:24px;display:flex;align-items:center;gap:8px}
.acts{display:flex;gap:6px;flex-wrap:wrap}
.acts button{flex:1;border:none;background:var(--soft);border-radius:12px;padding:9px 6px;font-size:16px;white-space:nowrap}
.acts button.warn{background:#ffe4e1}
.nums{display:grid;grid-template-columns:1fr 1fr;gap:8px}
.num span{font-size:14px;color:#8a7f70}
.num div{display:flex;align-items:center;background:var(--soft);border-radius:12px;overflow:hidden}
.num button{border:none;background:transparent;width:34px;height:40px;font-size:22px;flex:none}
.num input{width:100%;min-width:0;border:none;background:#fff;text-align:center;font-size:18px;height:40px;-moz-appearance:textfield}
.num input::-webkit-inner-spin-button{-webkit-appearance:none}
.chk{display:flex;align-items:center;gap:8px;margin-top:8px;font-size:17px}
.chk input{width:22px;height:22px}
.cols{display:flex;flex-wrap:wrap;gap:6px;align-items:center}
.cols button{width:32px;height:32px;border-radius:50%;border:2px solid #0002;padding:0}
.cols button.on{box-shadow:0 0 0 3px var(--accent)}
.cols input[type=color]{width:40px;height:34px;border:none;background:none;padding:0}
.emo{display:grid;grid-template-columns:repeat(8,1fr);gap:4px}
.emo button{border:none;background:var(--soft);border-radius:10px;font-size:20px;padding:4px 0}
.emo button.on{background:#ffd3bd}
.txt{width:100%;border:2px solid #eee;border-radius:12px;padding:8px 10px;font-size:20px;-webkit-user-select:text;user-select:text}
input[type=range]{width:100%}
.hintbox{background:#fff8e1;border-radius:14px;padding:10px 12px;font-size:16px;line-height:1.5;color:#7a6a50}
/* 보기 */
.vw{position:absolute;inset:0;display:grid;grid-template-columns:1fr 340px}
.stage3d{position:relative;min-width:0;min-height:0;background:radial-gradient(circle at 50% 40%,#ffffff,#efe6d8);touch-action:none;cursor:grab}
.stage3d canvas{display:block;width:100%;height:100%}
.vbar{position:absolute;left:50%;bottom:14px;transform:translateX(-50%);display:flex;gap:6px;background:#fffc;border-radius:16px;padding:6px;box-shadow:0 3px 10px #0001;flex-wrap:wrap;justify-content:center}
.vbar button{border:none;background:var(--soft);border-radius:12px;padding:8px 12px;font-size:17px}
.vbar button.on{background:#ffe1cf}
.vside{background:#fff;border-left:3px solid var(--line);overflow-y:auto;padding:18px}
.vside h2{font-weight:normal;font-size:30px;margin:0 0 4px}
.vside .date{color:#9a8f80;margin-bottom:12px}
.vside .intro{background:var(--soft);border-radius:16px;padding:12px;font-size:19px;line-height:1.5;min-height:60px;white-space:pre-wrap;margin-bottom:14px}
.spec{display:grid;grid-template-columns:auto 1fr;gap:4px 12px;font-size:17px;color:#6a6050;margin-bottom:16px}
.bigb{width:100%;border:none;border-radius:18px;padding:14px;font-size:21px;background:var(--soft);margin-bottom:8px}
.bigb.main{background:var(--accent);color:#fff;box-shadow:0 4px 0 #c9541f}
.bigb.warn{background:#ffe4e1}
.msg3d{position:absolute;inset:0;display:grid;place-items:center;color:#9a8f80;font-size:20px;text-align:center;padding:20px}
/* 모달 */
.ov{position:fixed;inset:0;background:#0007;display:none;align-items:center;justify-content:center;z-index:80;padding:16px}
.ov.show{display:flex}
.box{background:#fff;border-radius:24px;padding:20px;max-width:520px;width:100%;max-height:92vh;overflow:auto;font-size:19px}
.box h2{margin:0 0 12px;font-weight:normal}
.box label{display:block;margin:10px 0 4px;color:#8a7f70;font-size:16px}
.box textarea{width:100%;border:2px solid #eee;border-radius:12px;padding:8px 10px;font-size:18px;min-height:80px;-webkit-user-select:text;user-select:text}
.row{display:flex;gap:8px;margin-top:14px}
.row button{flex:1;border:none;border-radius:14px;padding:12px;font-size:19px;background:var(--soft)}
.row button.go{background:var(--ok);color:#fff}
.row button.warn{background:#ffe4e1}
.selbar{display:none;gap:4px;background:#fff8f2;padding:6px;flex-wrap:wrap;justify-content:center;border-top:3px solid var(--line)}
.selbar.show{display:flex}
.selbar button{border:none;background:var(--soft);border-radius:12px;min-width:54px;height:58px;display:flex;flex-direction:column;align-items:center;justify-content:center;font-size:21px;line-height:1;gap:4px;padding:0 6px;touch-action:none}
.selbar button small{font-size:13px;color:#6a6050}
.selbar button:active{background:#ffd3bd}
.selbar button.warn{background:#ffe4e1}.selbar button.ok{background:#e3f6ea}
.selbar .sep{width:2px;background:#eee;margin:4px 2px}
.cats{display:flex;gap:6px;flex-wrap:wrap;margin-bottom:8px}
.cats button{border:none;background:var(--soft);border-radius:12px;padding:7px 12px;font-size:16px}
.cats button.on{background:#ffd3bd}
.apptray .ti{cursor:pointer}
.symtray{grid-template-columns:repeat(auto-fill,minmax(46px,1fr))}
.ti.sym{font-size:28px;padding:6px 0;justify-content:center;font-family:'Apple Color Emoji','Segoe UI Emoji','Noto Color Emoji',sans-serif}
.bigadd{width:100%;border:none;border-radius:16px;padding:14px;font-size:21px;background:#e3f6ea;box-shadow:0 3px 0 #c5e8d2}
.cols button.none{background:repeating-conic-gradient(#ddd 0 25%,#fff 0 50%) 0 0/10px 10px}
textarea.txt{min-height:100px;resize:vertical;line-height:1.4}
h4 small{font-size:13px;color:#b0a594}
/* 작업대·진열장 */
.hometabs{display:flex;gap:8px;flex:1;justify-content:center}
.htab{border:none;border-radius:16px;padding:10px 22px;font-size:22px;background:var(--soft);display:flex;align-items:center;gap:8px}
.htab b{font-weight:normal;background:#fff;border-radius:10px;padding:0 8px;font-size:16px}

function fitFont(t,w,h,k=.8){t=String(t||'');let u=0;for(const ch of t)u+=/[가-힣ㄱ-ㅎ]/.test(ch)?1:(/[←-⯿\ud83c-\udbff]/.test(ch)?1:.62);return Math.max(.3,Math.min(h*k,w*.9/Math.max(u,.6)))}
function chW(ch){return /[가-힣ㄱ-ㅎㅏ-ㅣ]/.test(ch)?1:ch===' '?.32:/[A-Z0-9MWmw]/.test(ch)?.66:/[\u2190-\u2bff\ud800-\udfff]/.test(ch)?1.1:.55}
function txtW(t,fs){let a=0;for(const ch of t)a+=chW(ch);return a*fs}
function wrapText(t,maxW,fs){const out=[];for(const para of String(t??'').split('\n')){let line='';
  for(let wd of para.split(' ')){const cand=line?line+' '+wd:wd;if(txtW(cand,fs)<=maxW){line=cand;continue}
    if(line){out.push(line);line=''}
    let chars=[...wd];while(chars.length>1&&txtW(chars.join(''),fs)>maxW){let i=1;while(i<chars.length&&txtW(chars.slice(0,i+1).join(''),fs)<=maxW)i++;out.push(chars.slice(0,i).join(''));chars=chars.slice(i)}line=chars.join('')}
  out.push(line)}return out}
function vCols(t,maxH,fs){const per=Math.max(1,Math.floor((maxH+1e-6)/(fs*1.12))),out=[];
  for(const para of String(t??'').split('\n')){const ch=[...para];if(!ch.length){out.push([]);continue}for(let i=0;i<ch.length;i+=per)out.push(ch.slice(i,i+per))}return out}
function tbNeedW(p){const fs=p.fs||5;return r2(vCols(p.t,p.h-fs*.9,fs).length*fs*1.3+fs*.9)}
function tbNeed(p){const fs=p.fs||5;return r2(wrapText(p.t,p.w-fs*.9,fs).length*fs*1.3+fs*.9)}
function autoFit(p,exact){if(p.type!=='tbox')return;if(p.v){const n=tbNeedW(p);if(exact||p.w<n)p.w=n;return}const n=tbNeed(p);if(exact||p.h<n)p.h=n}

  case'tri':return `<polygon points="0,${y} ${-x},${-y} ${x},${-y}" fill="${c}"/>`;
  case'line':return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${m/2}" fill="${c}"/>`;
  case'text':return T(p.t,fitFont(p.t,w,h,.9),c);
  case'tbox':{const fs=p.fs||5,pad=fs*.45,lines=wrapText(p.t,w-2*pad,fs),lh=fs*1.3,y0=-(lines.length*lh)/2+lh/2,ax=p.al==='start'?x+pad:0;
    let g='';if(p.c2&&p.c2!=='none')g+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(fs*.5,m/2)}" fill="${p.c2}"/>`;
    if(p.b)g+=`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${Math.min(fs*.5,m/2)}" fill="none" stroke="${c}" stroke-opacity=".45" stroke-width="${Math.max(.2,fs*.07)}"/>`;
    if(p.v){const cols=vCols(p.t,h-2*pad,fs),cw=fs*1.3,st=fs*1.12,N=cols.length;

  case'toggle':{const v=w>=h;return `<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="${m/2}" fill="${c}" stroke="#00000044" stroke-width="${m*.06}"/><circle cx="${v?w/4:0}" cy="${v?0:-h/4}" r="${m*.38}" fill="#fff"/>`}
  case'dial':{let t='';for(let i=0;i<12;i++){const a=i*30;t+=`<line x1="0" y1="${-R*.86}" x2="0" y2="${-R*.97}" stroke="#00000066" stroke-width="${R*.05}" transform="rotate(${a})"/>`}
    return `<g transform="scale(${w/m} ${h/m})"><circle r="${R}" fill="${c}" stroke="#00000044" stroke-width="${R*.05}"/>${t}<circle r="${R*.72}" fill="${c}" stroke="#00000033" stroke-width="${R*.04}"/><circle r="${R*.62}" fill="#fff" opacity=".15"/><line x1="0" y1="${-R*.15}" x2="0" y2="${-R*.62}" stroke="#2b2b2e" stroke-width="${R*.09}" stroke-linecap="round"/></g>`}

function photoPrompt(hint){return `A student who loves building model electronic devices took this photo. Turn the device in the photo into an editable flat design for our model-making app.

- front and back are w×h (back is drawn as seen from behind);
- left and right are d×h (on the right face x=0 is the front edge; on the left face x=0 is the back edge);
- top and bottom are w×d (on the top face y=0 is the back edge; on the bottom face y=0 is the front edge).
A part is {"type":..., "x":center x, "y":center y, "w":width, "h":height, "rot":degrees} plus optional "c","c2" (#rrggbb), "t" (short text), "e" (one emoji), "r" (corner radius), "fs" (font size).

${hint?`The student says the device is: ${hint}\n`:''}`}

  return pr}

const GS_CODE="// 진서의 전자기기 공방 — 작품함 (구글 시트에 붙여 넣는 코드) · 2판 (만들던 작품 백업 포함)\nfunction doPost(e){\n  var d = JSON.parse(e.postData.contents);\n  if (d.type === 'state') {\n    PropertiesService.getScriptProperties().setProperty('lock', JSON.stringify(d.lock || {}));\n    return out_({ok: true});\n  }\n  if (d.type === 'backup') {\n    var b = bakSheet_(), v = b.getDataRange().getValues(), row = [new Date(), d.from || '', d.name || '', String(d.id), Number(d.updated || 0), JSON.stringify(d.project)];\n    for (var i = 1; i < v.length; i++) { if (String(v[i][3]) === String(d.id)) { b.getRange(i + 1, 1, 1, 6).setValues([row]); return out_({ok: true}); } }\n    b.appendRow(row);\n    return out_({ok: true});\n  }\n  if (d.type === 'backupdel') {\n    var b2 = bakSheet_(), v2 = b2.getDataRange().getValues();\n    for (var j = v2.length - 1; j >= 1; j--) { if (String(v2[j][3]) === String(d.id)) b2.deleteRow(j + 1); }\n    return out_({ok: true});\n  }\n  if (d.type === 'tpl') {\n    tplSheet_().appendRow([new Date(), d.name || '', d.cat || '', d.id || '', JSON.stringify({group: d.group || '', design: d.design})]);\n    return out_({ok: true});\n  }\n  if (d.type === 'tpldel') {\n    var sh = tplSheet_(), v = sh.getDataRange().getValues();\n    for (var i = v.length - 1; i >= 1; i--) { if (String(v[i][3]) === String(d.id)) sh.deleteRow(i + 1); }\n    return out_({ok: true});\n  }\n  sheet_().appendRow([new Date(), d.from || '', d.name || '', d.id || '', JSON.stringify(d.project)]);\n  return out_({ok: true});\n}\nfunction doGet(e){\n  var p = (e && e.parameter) || {};\n  if (p.type === 'state') {\n    var v = PropertiesService.getScriptProperties().getProperty('lock');\n    return out_({ok: true, lock: v ? JSON.parse(v) : null});\n  }\n  if (p.type === 'ver') return out_({ok: true, ver: 2});\n  if (p.type === 'backup') {\n    var bk = [];\n    bakSheet_().getDataRange().getValues().slice(1).forEach(function(r){\n      if (r[5]) { try { bk.push({id: String(r[3]), updated: Number(r[4]), project: JSON.parse(r[5])}); } catch (err) {} }\n    });\n    return out_({ok: true, ver: 2, backup: bk});\n  }\n  var works = sheet_(), tpls = tplSheet_();\n  if (p.type === 'tpl') {\n    var items = [];\n    tpls.getDataRange().getValues().slice(1).forEach(function(r){\n      if (!r[4]) return;\n      try { var x = JSON.parse(r[4]); items.push({t: new Date(r[0]).getTime(), name: r[1], cat: r[2], id: String(r[3]), group: x.group || '', design: x.design || x}); } catch (err) {}\n    });\n    return out_({ok: true, items: items});\n  }\n  var since = Number(p.since || 0), list = [];\n  works.getDataRange().getValues().slice(1).forEach(function(r){\n    var t = new Date(r[0]).getTime();\n    if (t > since && r[4]) { try { list.push({t: t, from: r[1], name: r[2], project: JSON.parse(r[4])}); } catch (err) {} }\n  });\n  return out_({ok: true, items: list});\n}\nfunction sheet_(){ return getOrMake_('작품', ['받은 시간', '보낸 학생', '작품 이름', '작품 번호', '작품 데이터']); }\nfunction tplSheet_(){ return getOrMake_('도안', ['만든 시간', '도안 이름', '탭', '도안 번호', '도안 데이터']); }\nfunction bakSheet_(){ return getOrMake_('백업', ['저장한 시간', '학생', '작품 이름', '작품 번호', '고친 시각', '작품 데이터']); }\nfunction getOrMake_(name, head){\n  var ss = SpreadsheetApp.getActiveSpreadsheet(), sh = ss.getSheetByName(name);\n  if (!sh) { sh = ss.insertSheet(name); sh.appendRow(head); }\n  return sh;\n}\nfunction out_(o){ return ContentService.createTextOutput(JSON.stringify(o)).setMimeType(ContentService.MimeType.JSON); }\n";

    <div class="row"><button id="lkX">닫기</button>${!remote&&TEACHER?'<button class="go" id="lkBack">👩‍🏫 선생님 모드 끄고 진서에게 주기</button>':''}</div>`;
  $('#ov').classList.add('show');
  $('#box').querySelectorAll('[data-lk]').forEach(b=>b.onclick=()=>{const k=b.dataset.lk;
    if(k==='lock'){setLock('locked');toast(remote?'🔒 진서 공방을 잠갔어요':'🔒 잠갔어요')}
    else if(k==='open'){setLock('open');toast('🔓 계속 열어 두었어요')}
    else if(k==='add10'){setLock('add',10);toast('⏰ 10분 더 주었어요')}
    else{const m=+k.slice(1);setLock('timed',m);toast(`🔓 ${m<60?m+'분':'1시간'} 동안 열어 주었어요`)}
    const d1=$('#lkSub').value,d2=$('#lkRule').value;lockDialog();$('#lkSub').value=d1;$('#lkRule').value=d2});
  $('#box').querySelectorAll('[data-lm]').forEach(b=>b.onclick=()=>{if(b.dataset.lm==='def'){setLockMsg({...LKDEF});toast('처음 문구로 돌렸어요')}else{setLockMsg({sub:$('#lkSub').value.trim(),rule:$('#lkRule').value.trim()});toast(remote?'✏️ 문구를 진서 태블릿에 보냈어요':'✏️ 문구를 저장했어요')}sfx.pop();lockDialog()});
  $('#lkX').onclick=closeOv;const bk=$('#lkBack');if(bk)bk.onclick=()=>{TEACHER=false;closeOv();rerender();applyLock()}}
$('#lkT').onclick=()=>teacherGate(()=>{applyLock();lockDialog()});
setInterval(applyLock,1000);setTimeout(()=>{pullLock();applyLock()},800);setInterval(pullLock,20000);
/* ================= 선생님 설정 ================= */
function autoSec(){return `      <label>이 기기는</label><div class="acts">${[['student','🧒 진서 태블릿 (보내기)'],['teacher','👩‍🏫 선생님 컴퓨터 (받기)'],['','끄기']].map(([k,n])=>`<button data-role="${k}" style="${(db.role||'')===k?'background:#ffd3bd':''}">${n}</button>`).join('')}</div>
      <label>작품함 주소 (웹 앱 URL)</label><input class="txt" id="sUrl" placeholder="https://script.google.com/macros/s/…/exec" value="${esc(db.inbox||'')}" style="font-size:15px">
      <div class="row"><button id="sTest">🔌 연결 확인</button><button id="sGuide">❓ 연결하는 방법·코드</button>${db.role==='teacher'?'<button id="sPull">📥 지금 받아 오기</button>':''}</div>
      ${(db.outbox||[]).length?`<div class="legend">아직 못 보낸 작품 ${db.outbox.length}개 (인터넷이 되면 보내요)</div>`:''}`}
async function makeGithubFile(){if(!db.inbox){toast('작품함 주소를 먼저 넣어 주세요');return}
  let src='';try{src=await (await fetch(location.href.split('#')[0],{cache:'no-store'})).text()}catch(e){}
  if(!src.includes('/*CFG*/')){toast('깃허브 사이트에서 열었을 때만 만들 수 있어요');return}
  const cfg={inbox:db.inbox,name:db.name};if(db.pin)cfg.pinH=pinHash(db.pin);else if(CFG.pinH)cfg.pinH=CFG.pinH;
  const out=src.replace(/\/\*CFG\*\/[\s\S]*?\/\*CFG\*\//,'/*CFG*/'+JSON.stringify(cfg)+'/*CFG*/');
  const a=document.createElement('a');a.href=URL.createObjectURL(new Blob([out],{type:'text/html'}));a.download='index.html';document.body.appendChild(a);a.click();setTimeout(()=>{URL.revokeObjectURL(a.href);a.remove()},2000);
  sfx.yay();toast('📦 index.html을 받았어요. 깃허브의 예전 파일 자리에 올려 주세요')}
function openSettings(){const code=()=>{try{return btoa(unescape(encodeURIComponent(JSON.stringify(db.projects))))}catch(e){return''}};
  $('#box').className='box';$('#box').innerHTML=`<h2>⚙️ 선생님 설정 <small style="font-size:14px;color:#9a8f80;font-weight:normal">버전 ${APP_VER}</small></h2><label>학생 이름</label><input class="txt" id="sN" maxlength="8" value="${esc(db.name)}">
    <label>작품 백업 (이 기기에만 저장되니, 가끔 백업해 두세요)</label><div class="row" style="margin-top:4px"><button id="sCopy">📋 백업 코드 복사</button><button id="sLoad">📥 백업 불러오기</button></div>
    <textarea id="sCode" style="display:none;margin-top:8px" placeholder="백업 코드를 붙여넣어요"></textarea><div class="row" id="sLoadRow" style="display:none"><button class="go" id="sApply">불러오기</button></div>
    <div class="sec"><h3>📥 진서가 보낸 작품 받기</h3><div style="color:#8a7f70;font-size:15px">진서가 '선생님께 보내기'로 보낸 파일(.json)을 골라요. 받은 작품은 진열장에 놓이고, 여기서 인쇄할 수 있어요.</div>
      <input type="file" id="sImp" accept=".json,application/json" hidden><div class="row"><button class="go" id="sImpB">📂 작품 파일 고르기</button></div></div>
    <div class="sec"><h3>📤 이 기기의 작품 모두 보내기</h3><div class="row"><button id="sExp">📤 모든 작품 보내기 (${db.projects.length}개)</button></div></div>
    <div class="sec"><h3>📮 자동 보내기 (구글 시트 작품함)</h3><div style="color:#8a7f70;font-size:15px">연결해 두면 진서가 ✅ 완성을 누를 때마다 작품이 선생님 컴퓨터로 저절로 와요. 선생님 컴퓨터는 앱을 열 때와 1분마다 새 작품을 받아 와요.</div>
      ${framedNow()?`<div class="legend">이 화면(Claude 링크)에서는 사진으로 만든 도안을 진서 사이트로 보낼 때만 작품함을 써요. 작품함 <b>구글 시트 주소</b>(docs.google.com/spreadsheets/d/…)를 넣어 주세요.</div>
        <input class="txt" id="sSheet" placeholder="https://docs.google.com/spreadsheets/d/…" value="${db.sheetId?'https://docs.google.com/spreadsheets/d/'+esc(db.sheetId):''}" style="font-size:15px">
        <div class="row"><button id="sSheetT">🔌 시트 연결 확인</button></div>`:''}
${framedNow()?'':autoSec()}</div>
    ${framedNow()?'':`<div class="sec"><h3>☁️ 만들던 작품 백업</h3><div style="color:#8a7f70;font-size:15px">진서 태블릿은 만들던 작품도 3분마다, 그리고 공방에서 나올 때 작품함에 몰래 저장해요. 태블릿 데이터가 지워져도 여기서 되살릴 수 있어요. 진서 태블릿 작품이 하나도 없으면 저절로 되살려요.</div>
      <div id="bkInfo" class="legend">작품함 확인 중…</div><div class="row"><button id="sRest">☁️ 작품함에서 되살리기</button>${db.role==='student'?'<button id="sBkNow">💾 지금 백업하기</button>':''}</div></div>
    <div class="sec"><h3>📦 깃허브에 올릴 파일 만들기</h3><div style="color:#8a7f70;font-size:15px">지금 넣어 둔 <b>작품함 주소</b>와 <b>선생님 비밀번호</b>가 들어간 파일을 만들어요. 이 파일을 깃허브에 올리면, 진서 태블릿 데이터가 지워지거나 새 브라우저에서 열어도 작품함에 저절로 연결되고 잠금도 그대로 걸려요.</div>
      <div class="row"><button class="go" id="sGen">📦 깃허브용 index.html 만들기</button></div>${CFG.inbox?`<div class="legend">✅ 지금 파일에는 작품함 주소가 들어 있어요.</div>`:''}</div>`}
    <div class="sec"><h3>🔒 공방 잠금</h3><div style="color:#8a7f70;font-size:15px">지금: <b>${lockText()}</b></div><div class="row"><button id="sLock">🔒 잠금 관리 열기</button></div></div>
    <div class="sec"><h3>🔑 비밀번호</h3><div class="row"><button id="sPin">비밀번호 바꾸기</button></div></div>
    <div class="row"><button class="warn" id="sWipe">🗑️ 작품 모두 지우기</button></div>
    <div class="row"><button class="go" id="sOk">확인</button></div>`;
  $('#sImpB').onclick=()=>$('#sImp').click();$('#sImp').onchange=e=>{const f=e.target.files[0];if(f)importWorks(f)};
  $('#sExp').onclick=()=>{if(!db.projects.length){toast('작품이 없어요');return}sendWorks(db.projects,'모든작품')};
  $('#sPin').onclick=()=>pinDialog('set',()=>{});$('#sLock').onclick=lockDialog;
  if($('#sRest')){$('#sRest').onclick=()=>restoreBackup(false);const bn=$('#sBkNow');if(bn)bn.onclick=async()=>{await backupNow();toast('💾 백업했어요')};$('#sGen').onclick=makeGithubFile;
    (async()=>{const el=$('#bkInfo');if(!el)return;if(!canAuto()){el.textContent='작품함이 연결되어 있지 않아요. 아래 📮 자동 보내기를 먼저 연결해 주세요.';return}
      const v=await gsVer();if(!$('#bkInfo'))return;el.innerHTML=v>=2?'✅ 작품함이 백업을 받을 수 있어요.':v===1?'⚠️ 작품함 코드가 옛날 것이라 백업을 못 해요. <b>❓ 연결하는 방법·코드</b>에서 새 코드를 복사해 Apps Script에 붙여 넣고, <b>배포 → 배포 관리 → ✏️ → 새 버전</b>으로 다시 배포해 주세요. (주소는 그대로예요)':'작품함에 연결하지 못했어요.'})()}
  if($('#sUrl')){$('#sUrl').oninput=()=>{db.inbox=$('#sUrl').value.trim();saveNow()};

  $('#box').querySelectorAll('[data-role]').forEach(b=>b.onclick=()=>{db.role=b.dataset.role;db.inbox=$('#sUrl').value.trim();saveNow();sfx.pop();openSettings();if(db.role==='teacher')pullInbox(true);if(db.role==='student')flushOutbox()});
  $('#sTest').onclick=()=>{db.inbox=$('#sUrl').value.trim();saveNow();testInbox()};$('#sGuide').onclick=inboxGuide}
  const sh=$('#sSheet');if(sh){sh.oninput=()=>{const m=sh.value.match(/\/d\/([a-zA-Z0-9_-]{20,})/)||sh.value.trim().match(/^([a-zA-Z0-9_-]{20,})$/);db.sheetId=m?m[1]:'';saveNow()};
    $('#sSheetT').onclick=()=>{if(!db.sheetId){toast('시트 주소를 먼저 넣어 주세요');return}if(!MCP){toast('구글 시트 연결(커넥터)을 쓸 수 없는 화면이에요');return}syncTemplates(false)}}
  const pl=$('#sPull');if(pl)pl.onclick=()=>pullInbox(false);
  $('#ov').classList.add('show');
  $('#sCopy').onclick=async()=>{const c=code(),ta=$('#sCode');ta.style.display='block';ta.value=c;$('#sLoadRow').style.display='none';try{await navigator.clipboard.writeText(c);toast(`작품 ${db.projects.length}개를 복사했어요`)}catch(e){ta.select();toast('아래 코드를 직접 복사해 주세요')}};
  $('#sLoad').onclick=()=>{const ta=$('#sCode');ta.style.display='block';ta.value='';ta.focus();$('#sLoadRow').style.display='flex'};
  $('#sApply').onclick=()=>{try{const arr=JSON.parse(decodeURIComponent(escape(atob($('#sCode').value.trim()))));if(!Array.isArray(arr))throw 0;let n=0;arr.forEach(p=>{if(p&&p.id&&p.faces&&!db.projects.some(q=>q.id===p.id)){db.projects.push(p);n++}});saveNow();toast(`작품 ${n}개를 불러왔어요`);$('#ov').classList.remove('show');if(VIEW==='gallery')showGallery()}catch(e){toast('코드가 올바르지 않아요')}};
  let sure=false;$('#sWipe').onclick=e=>{if(!sure){sure=true;e.target.textContent='정말요? 한 번 더 누르면 모두 지워져요';return}forgetBackup(db.projects.map(p=>p.id));db.projects=[];saveNow();$('#ov').classList.remove('show');go('gallery','bench')};
  $('#sOk').onclick=()=>{const v=$('#sN').value.trim();if(v)db.name=v;saveNow();$('#ov').classList.remove('show');go(VIEW==='viewer'?'gallery':VIEW,VIEW==='viewer'?'shelf':VARG)}}

/* ================= 축하 ================= */
function confetti(){const c=$('#confetti'),x=c.getContext('2d');c.width=innerWidth;c.height=innerHeight;const cols=['#ff7a3d','#2fbf71','#3d8bff','#ffd84d','#f5a3c0','#a58be0'];
  const ps=Array.from({length:150},()=>({x:Math.random()*c.width,y:-20-Math.random()*c.height*.4,vx:(Math.random()-.5)*4,vy:2+Math.random()*4,r:Math.random()*6,s:5+Math.random()*7,c:cols[Math.random()*6|0]}));
  const t0=performance.now();(function f(t){x.clearRect(0,0,c.width,c.height);ps.forEach(p=>{p.x+=p.vx;p.y+=p.vy;p.vy+=.05;p.r+=.1;x.save();x.translate(p.x,p.y);x.rotate(p.r);x.fillStyle=p.c;x.fillRect(-p.s/2,-p.s/4,p.s,p.s/2);x.restore()});if(t-t0<3000)requestAnimationFrame(f);else x.clearRect(0,0,c.width,c.height)})(t0)}

$('#ov').addEventListener('click',e=>{if(e.target.id==='ov')closeOv()});
go('gallery',db.lastTab||'bench');
</script>
